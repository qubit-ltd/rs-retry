[package]
name = "qubit-retry"
autotests = false
version = "0.18.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-retry"
description = "Retry module, providing a feature-complete, type-safe retry management system with support for multiple delay strategies and event listeners"
homepage = "https://github.com/qubit-ltd/rs-retry"
documentation = "https://docs.rs/qubit-retry"
readme = "README.md"
keywords = ["retry", "resilience", "backoff", "fault-tolerance", "qubit"]
categories = ["development-tools", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_retry"

[[test]]
name = "tests"
path = "tests/lib_tests.rs"

[[bench]]
name = "retry_benchmarks"
harness = false

[features]
default = []
tokio = ["dep:tokio", "qubit-clock/tokio"]

[dependencies]
qubit-budget = { version = "0.4", path = "../rs-budget", features = ["time"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = ["time", "rt", "macros"], optional = true }
rand = "0.10"
thiserror = "2"

qubit-error = "0.2"
qubit-datatype = { version = "0.11", path = "../rs-datatype", default-features = false, features = ["duration"] }
qubit-function = "0.16"
qubit-clock = "0.12"

[dev-dependencies]
criterion = "0.5"
qubit-clock = { version = "0.12", features = ["test-util"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
