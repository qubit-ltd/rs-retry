[package]
name = "qubit-retry"
version = "0.16.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-retry"
description = "Retry module, providing a feature-complete, type-safe retry management system with support for multiple delay strategies and event listeners"
homepage = "https://github.com/qubit-ltd/rs-retry"
documentation = "https://docs.rs/qubit-retry"
readme = "README.md"
keywords = ["retry", "resilience", "backoff", "fault-tolerance", "qubit"]
categories = ["development-tools", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_retry"

[features]
default = []
tokio = ["dep:tokio", "qubit-clock/tokio"]
config = ["dep:qubit-config"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
parse-display = "0.11"
tokio = { version = "1.52", features = ["time", "rt", "macros"], optional = true }
rand = "0.10"

qubit-argument = "0.4"
qubit-error = "0.2"
qubit-datatype = { version = "0.9", default-features = false, features = ["duration"] }
qubit-config = { version = "0.14", path = "../rs-config", optional = true }
qubit-function = "0.16"
qubit-clock = { version = "0.10", path = "../rs-clock" }

[dev-dependencies]
qubit-clock = { version = "0.10", path = "../rs-clock", features = ["test-util"] }
serde_json = "1.0"
qubit-value = { version = "0.10.0", path = "../rs-value" }
tokio = { version = "1.52", features = ["full", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
